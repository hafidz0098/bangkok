function renderSubs(t) { let on = null; SUBS.forEach(w => { if (t >= w.s - 1e-4 && t < w.next) on = w; }); SUBS.forEach(w => w.g.style.visibility = w === on ? 'visible' : 'hidden'); }
tl.eventCallback('onUpdate', () => { TL_T = tl.time(); renderWorld(TL_T); renderSubs(TL_T); renderWM(TL_T); });
const q = new URLSearchParams(location.search), vo = $('#vo'); let audioOn = false;
function start() { tl.play(0); vo.currentTime = 0; vo.play().then(() => audioOn = true).catch(() => {}); }
tl.eventCallback('onComplete', () => start());
gsap.ticker.add(fit);
gsap.ticker.add(() => { if (!audioOn || tl.paused()) return; if (Math.abs(vo.currentTime - tl.time()) > .12) vo.currentTime = tl.time(); });
window.OPENER = { W, H, DURATION: DUR, tl, ready: false, seek(t) { tl.pause(t, false); TL_T = t; renderWorld(t); renderSubs(t); renderWM(t); }, play: start };
addEventListener('keydown', e => { if (/^[rR]$/.test(e.key)) start(); if (e.code === 'Space') { e.preventDefault(); tl.paused() ? (tl.play(), vo.play()) : (tl.pause(), vo.pause()); } });
if (q.has('debug')) { const dbg = $('#dbg'); dbg.style.display = 'flex'; const sc = $('#dScrub'), ck = $('#dClock'); let drag = false;
  gsap.ticker.add(() => { if (!drag) sc.value = String(tl.time() / DUR * 1000); ck.textContent = tl.time().toFixed(2) + 's'; $('#dPlay').textContent = tl.paused() ? 'Play' : 'Pause'; });
  sc.addEventListener('pointerdown', () => { drag = true; tl.pause(); vo.pause(); }); addEventListener('pointerup', () => drag = false);
  sc.addEventListener('input', () => { tl.pause(); tl.time(sc.value / 1000 * DUR); }); $('#dPlay').onclick = () => tl.paused() ? (tl.play(), vo.currentTime = tl.time(), vo.play()) : (tl.pause(), vo.pause()); }
document.fonts.ready.then(() => Promise.all([...['Lilita One', 'Baloo 2'].map(f => document.fonts.load(`700 40px "${f}"`)), ...[['Noto Sans', 'Hà Nội ♪']].map(([f, t]) => document.fonts.load(`700 40px "${f}"`, t))])).then(() => {
  build(); tl.time(0); renderWorld(0); renderWM(0); window.OPENER.ready = true; if (q.has('clean')) return;
  vo.play().then(() => { audioOn = true; vo.currentTime = 0; tl.play(0); }).catch(() => { tl.pause(0); const go = () => { removeEventListener('pointerdown', go); removeEventListener('keydown', go); start(); }; addEventListener('pointerdown', go); addEventListener('keydown', go); }); });
